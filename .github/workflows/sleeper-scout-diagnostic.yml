name: Sleeper Scout League network diagnostic

on:
  push:
    branches:
      - diagnostic/sleeper-scout-league
    paths:
      - ".github/workflows/sleeper-scout-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Query public Sleeper API from GitHub runner
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.error

          base = "https://api.sleeper.app/v1"
          league_id = "1342629099633405952"

          def get(path):
              url = base + path
              req = urllib.request.Request(url, headers={"User-Agent": "WORP-Lab-Sleeper-Diagnostic/1.0"})
              with urllib.request.urlopen(req, timeout=25) as response:
                  body = response.read()
                  print(f"HTTP {response.status} {path} bytes={len(body)}")
                  return json.loads(body)

          try:
              league = get(f"/league/{league_id}")
              rosters = get(f"/league/{league_id}/rosters")
              users = get(f"/league/{league_id}/users")
              result = {
                  "status": "success",
                  "league_id": league.get("league_id"),
                  "name": league.get("name"),
                  "season": league.get("season"),
                  "status_sleeper": league.get("status"),
                  "total_rosters": league.get("total_rosters"),
                  "roster_positions": league.get("roster_positions"),
                  "settings": league.get("settings"),
                  "scoring_settings": league.get("scoring_settings"),
                  "rosters_returned": len(rosters) if isinstance(rosters, list) else None,
                  "users_returned": len(users) if isinstance(users, list) else None,
              }
              print("SLEEPER_DIAGNOSTIC_RESULT=" + json.dumps(result, sort_keys=True))
          except Exception as exc:
              print(f"SLEEPER_DIAGNOSTIC_FAILED={type(exc).__name__}: {exc}")
              raise
          PY
