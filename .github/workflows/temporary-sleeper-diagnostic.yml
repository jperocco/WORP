name: Temporary Sleeper league diagnostic
on:
  push:
    branches:
      - diagnostic/sleeper-scout-league
permissions:
  contents: read
jobs:
  inspect-sleeper:
    runs-on: ubuntu-latest
    steps:
      - name: Read public Sleeper league configuration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          league_id = "1342629099633405952"
          base = "https://api.sleeper.app/v1"
          def get(path):
              req = urllib.request.Request(base + path, headers={"User-Agent": "WoRP-Lab-diagnostic/1.0"})
              with urllib.request.urlopen(req, timeout=25) as response:
                  return json.load(response)
          league = get(f"/league/{league_id}")
          rosters = get(f"/league/{league_id}/rosters")
          users = get(f"/league/{league_id}/users")
          positions = league.get("roster_positions") or []
          nonstarters = {"BN", "IR", "TAXI", "RESERVE"}
          result = {
              "league_id": league.get("league_id"),
              "name": league.get("name"),
              "season": league.get("season"),
              "status": league.get("status"),
              "total_rosters_setting": league.get("total_rosters"),
              "actual_roster_count": len(rosters or []),
              "user_count": len(users or []),
              "roster_positions_raw": positions,
              "starter_slots_raw": [p for p in positions if p not in nonstarters],
              "starter_count_raw": sum(p not in nonstarters for p in positions),
              "bench_ir_taxi_slots": [p for p in positions if p in nonstarters],
              "scoring_settings": league.get("scoring_settings") or {},
              "settings": league.get("settings") or {},
              "metadata": league.get("metadata") or {},
          }
          print("SLEEPER_CONFIG_JSON_BEGIN")
          print(json.dumps(result, indent=2, sort_keys=True))
          print("SLEEPER_CONFIG_JSON_END")
          PY
