name: Slot eligibility regression tests

on:
  push:
    branches:
      - fix/scout-league-slot-eligibility
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pandas numpy
      - name: Check Python syntax
        run: >-
          python -m py_compile
          app_v0_9_4_7.py
          worp_engine.py
          worp_lineup_economics_v0_9_4.py
          worp_league_reading_v0_9_5.py
          worp_roster_construction_product_v0_9_4.py
          worp_roster_scenarios.py
      - name: Run eligibility and adjacent regression tests
        run: >-
          python -m unittest
          test_slot_eligibility
          test_lineup_economics_v0_9_4
          test_league_reading_v0_9_5
          test_roster_scenarios
          test_roster_construction_product_v0_9_4
          test_empirical_win_model
